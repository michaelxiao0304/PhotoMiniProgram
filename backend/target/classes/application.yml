server:
  port: 9080
  address: 0.0.0.0

spring:
  profiles:
    active: dev
  application:
    name: photo-mini-program

# yt-dlp configuration
yt-dlp:
  command: /home/ubuntu/.local/bin/yt-dlp
  temp-dir: /tmp/photo-mini-program
  timeout-seconds: 300
  cookies-file: /home/ubuntu/.config/instagram-cookies.txt
